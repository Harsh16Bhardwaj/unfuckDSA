<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>unfuckDSA</title>
  </head>
  <body>
    <header>
      <img src="sprout-pet.png" alt="" />
      <div><strong>unfuckDSA</strong><span>LeetCode tracker</span></div>
      <i id="statusDot"></i>
    </header>
    <main>
      <div class="ready"><i></i><div><strong>On-page tracker ready</strong><span id="activeStatus">Open a LeetCode problem to begin.</span></div></div>
      <label>Tracker position<select id="placement"><option value="bottom-left">Bottom left</option><option value="bottom-right">Bottom right</option><option value="top-right">Top right</option></select></label>
      <button id="openAppButton" class="primary dashboard-button">Open dashboard</button>
      <p id="placementStatus" class="status"></p>
      <section class="pairing">
        <div class="pairing-title"><div><strong>Connect this browser</strong><span>Use the reusable key shown on your dashboard.</span></div><b id="pairState">Not paired</b></div>
        <label>Account pairing key<input id="pairCode" autocomplete="off" placeholder="AB12-CD34-EF56" /></label>
        <button id="pairButton" class="secondary full">Pair extension</button>
        <button id="unpairButton" class="link" hidden>Disconnect this browser</button>
        <p id="pairError" class="error"></p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
